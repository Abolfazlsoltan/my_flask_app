<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود و ثبت‌نام</title>
    <meta name="google-signin-client_id" content="207402635906-870umranl5hqpbh046ltn0vlnrp2jk55.apps.googleusercontent.com">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            max-width: 420px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 15px; }

        .tabs {
            display: flex;
            background: #f8f9fa;
        }
        .tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }

        .form-container {
            padding: 40px 30px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button.main-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button.main-btn:hover { background: #5a6fd8; }

        .or-divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
            color: #888;
        }
        .or-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e1e5e9;
        }
        .or-divider span {
            background: white;
            padding: 0 15px;
        }

        .google-btn-container {
            text-align: center;
        }

        .form-content { display: none; }
        .form-content.active { display: block; animation: fadeIn 0.4s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>به سایت خوش آمدید</h1>
        <p>با ایمیل یا گوگل وارد شوید</p>
    </div>

    <div class="tabs">
        <div class="tab active" data-form="login">ورود</div>
        <div class="tab" data-form="signup">ثبت‌نام</div>
    </div>

    <div class="form-container">

        <!-- فرم ورود -->
        <div id="login" class="form-content active">
            <form id="loginForm">
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="main-btn">ورود</button>
            </form>

            <div class="or-divider"><span>یا</span></div>
            
            <div class="google-btn-container">
                <div id="g_id_onload"
                     data-client_id="207402635906-870umranl5hqpbh046ltn0vlnrp2jk55.apps.googleusercontent.com"
                     data-callback="handleGoogleSignIn"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="filled_blue"
                     data-text="signin_with"
                     data-shape="rectangular"
                     data-logo_alignment="left"
                     data-width="340">
                </div>
            </div>
        </div>

        <!-- فرم ثبت‌نام -->
        <div id="signup" class="form-content">
            <form id="signupForm">
                <div class="form-group">
                    <label>نام کامل</label>
                    <input type="text" placeholder="علی رضایی" required>
                </div>
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" placeholder="حداقل ۶ کاراکتر" required minlength="6">
                </div>
                <button type="submit" class="main-btn">ایجاد حساب</button>
            </form>

            <div class="or-divider"><span>یا</span></div>
            
            <div class="google-btn-container">
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="filled_blue"
                     data-text="signup_with"
                     data-shape="rectangular"
                     data-logo_alignment="left"
                     data-width="340">
                </div>
            </div>
        </div>

        <div id="successMessage" class="success-message">
            با موفقیت وارد شدید!
        </div>
    </div>
</div>

<!-- اسکریپت گوگل -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
    // تعویض تب‌ها
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
            
            tab.classList.add('active');
            document.getElementById(tab.dataset.form).classList.add('active');
        });
    });

    // وقتی کاربر با گوگل وارد شد
    function handleGoogleSignIn(googleUser) {
        const profile = googleUser.getBasicProfile();
        const id_token = googleUser.getAuthResponse().id_token;

        console.log("نام:", profile.getName());
        console.log("ایمیل:", profile.getEmail());
        console.log("عکس:", profile.getImageUrl());
        console.log("توکن:", id_token);

        // اینجا می‌تونی کاربر رو خودکار لاگین کنی یا به بک‌اند بفرستی
        document.getElementById('successMessage').style.display = 'block';
        document.getElementById('successMessage').innerHTML = `
            خوش آمدی <strong>${profile.getName()}</strong>!<br>
            ایمیل: ${profile.getEmail()}
        `;
    }

    // فرم‌های معمولی (برای تست)
    document.getElementById('loginForm')?.addEventListener('submit', e => {
        e.preventDefault();
        alert('فرم ورود ارسال شد (برای واقعی کردن نیاز به بک‌اند داری)');
    });

    document.getElementById('signupForm')?.addEventListener('submit', e => {
        e.preventDefault();
        alert('فرم ثبت‌نام ارسال شد (برای واقعی کردن نیاز به بک‌اند داری)');
    });
</script>

</body>
</html>
